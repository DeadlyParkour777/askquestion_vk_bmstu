services:
  app:
    # image: deadlyparkour/qa_forum:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: django_app
    command: gunicorn -c gunicorn_config.py ask_pupkin.wsgi:application
    env_file:
      - .env
    networks:
      - django_network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
  
  my_wsgi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: my_wsgi_app
    command: gunicorn -w 2 -b 0.0.0.0:8081 my_wsgi:application
    ports:
      - "8081:8081"
    volumes:
      - .:/app
    networks:
      - django_network

  redis:
    image: redis:alpine
    container_name: redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - django_network

  centrifugo:
    image: centrifugo/centrifugo:v5
    container_name: centrifugo
    volumes:
      - ./centrifugo.json:/centrifugo/config.json
    command: centrifugo -c config.json
    ports:
      - "8001:8000"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    networks:
      - django_network

  db:
    image: postgres:16
    container_name: postgres_db
    restart: always
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - django_network

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "8080:80"
    depends_on:
      - app
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    networks:
      - django_network
  
volumes:
  postgres_data:
  static_volume:
  media_volume:

networks:
  django_network:
    driver: bridge
