<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="{% url 'index' %}">Ask Pupkin</a>
        <div class="collapse navbar-collapse">
            <form class="d-flex w-75 mx-auto position-relative" role="search" onsubmit="return false;">
                <input class="form-control me-2" type="search" id="search-input" 
                       placeholder="Найти вопрос..." aria-label="Search" autocomplete="off">
                <div id="search-results" class="list-group position-absolute w-100" 
                     style="top: 100%; z-index: 1000; display: none; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
                </div>
            </form>

            <script>
                document.addEventListener("DOMContentLoaded", function() {
                    const searchInput = document.getElementById('search-input');
                    const resultsBox = document.getElementById('search-results');
                    let timeout = null;

                    searchInput.addEventListener('input', function() {
                        clearTimeout(timeout);
                        const query = this.value.trim();

                        if (query.length < 3) {
                            resultsBox.style.display = 'none';
                            return;
                        }

                        timeout = setTimeout(() => {
                            fetch(`/search/?q=${encodeURIComponent(query)}`)
                                .then(response => response.json())
                                .then(data => {
                                    resultsBox.innerHTML = '';
                                    if (data.results.length > 0) {
                                        data.results.forEach(item => {
                                            const a = document.createElement('a');
                                            a.href = `/question/${item.id}/`;
                                            a.className = 'list-group-item list-group-item-action d-flex justify-content-between align-items-center';
                                            a.innerHTML = `
                                                <span>${item.title}</span>
                                                <span class="badge bg-primary rounded-pill">${item.rating}</span>
                                            `;
                                            resultsBox.appendChild(a);
                                        });
                                    } else {
                                        resultsBox.innerHTML = '<div class="list-group-item text-muted">Ничего не найдено</div>';
                                    }
                                    resultsBox.style.display = 'block';
                                })
                                .catch(err => console.error(err));
                        }, 300);
                    });

                    document.addEventListener('click', function(e) {
                        if (e.target !== searchInput && e.target !== resultsBox) {
                            resultsBox.style.display = 'none';
                        }
                    });
                });
            </script>
            
            <ul class="navbar-nav ms-auto mb-2 mb-lg-0 align-items-center">
                {% if user.is_authenticated %}
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            {{ user.username }}
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="navbarDropdown">
                            <li><a class="dropdown-item" href="{% url 'profile_edit' %}">Настройки профиля</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="{% url 'logout' %}?next={{ request.path }}">Выйти</a></li>
                        </ul>
                    </li>
                    <li class="nav-item ms-2">
                        {% if user.profile.avatar %}
                            <img src="{{ user.profile.avatar.url }}" class="rounded-circle" width="40" height="40" style="object-fit: cover;">
                        {% else %}
                            <img src="https://placehold.co/40" class="rounded-circle" width="40" height="40">
                        {% endif %}
                    </li>

                {% else %}
                    <li class="nav-item"><a class="nav-link" href="{% url 'login' %}">Войти</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'signup' %}">Регистрация</a></li>
                {% endif %}
            </ul>
        </div>
    </div>
</nav>
